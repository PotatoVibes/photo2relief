services:
  photo2relief:
    build: .
    image: photo2relief:cpu
    ports:
      # Bind to localhost only: this is an unauthenticated single-user app (see README
      # "Security & scope"). Publishing to 0.0.0.0 would expose file upload + compute to
      # anyone who can reach the host. Change the "127.0.0.1" prefix only if you know you
      # want LAN/remote access and have put auth in front of it.
      - "127.0.0.1:${P2R_PORT:-8090}:8090"
    environment:
      - P2R_PORT=8090
      - P2R_DEVICE=cpu
    volumes:
      - ./data/sessions:/srv/data/sessions
      - ./data/models:/srv/data/models
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
