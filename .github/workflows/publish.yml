name: publish

on:
  push:
    tags: ['v*']        # fires when you push a tag like v1.0.0

# Multi-arch is built the "native runner + digest merge" way (not QEMU): each
# (variant, arch) builds on a runner of its own architecture and pushes the image
# BY DIGEST (no tag). A second `merge` job then assembles those digests into one
# multi-arch manifest per variant and applies the human tags. This avoids the
# slow/OOM-prone arm64-under-QEMU emulation that made us skip arm64 originally.
#
# Coverage: the CPU image ships amd64 + arm64 (so it runs natively on Apple Silicon
# and other arm64 hosts); the GPU image stays amd64-only (CUDA on arm64 is Jetson/
# sbsa territory nobody here targets). Note: the arm64 runners are free only on
# public repos — a private fork would need larger/self-hosted arm runners.

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write     # required to push to ghcr.io
    strategy:
      fail-fast: false    # one (variant, arch) failing shouldn't cancel the others
      matrix:
        include:
          # CPU: both architectures, each on a native runner.
          - variant: cpu
            torch_extra: cpu
            platform: linux/amd64
            runner: ubuntu-latest
          - variant: cpu
            torch_extra: cpu
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          # GPU: amd64 only.
          - variant: gpu
            torch_extra: cu128
            platform: linux/amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # auto-provided, no setup needed

      - name: Sanitize platform for artifact naming
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            TORCH_EXTRA=${{ matrix.torch_extra }}
          labels: ${{ steps.meta.outputs.labels }}
          # Push by digest only; the merge job applies the real tags to the manifest.
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          # Cache keyed per variant AND arch so the three builds never clobber each other.
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Portable CPU manifest gets the clean tags (latest, 1.2.3, ...).
          - variant: cpu
            suffix: ""
          # GPU manifest gets -gpu-suffixed tags (latest-gpu, 1.2.3-gpu, ...).
          - variant: gpu
            suffix: "-gpu"
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.variant }}-*   # cpu: amd64+arm64; gpu: amd64 only
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # suffix applied to every tag; onlatest keeps it on `latest` too (-> latest-gpu)
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          # From a v1.2.3 tag: 1.2.3, 1.2, latest (each + suffix for the GPU variant)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - name: Inspect the published manifest
        # `latest` is always produced and the suffix flavor applies to it (-> latest-gpu),
        # so this names a tag that definitely exists regardless of the version string.
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:latest${{ matrix.suffix }}
