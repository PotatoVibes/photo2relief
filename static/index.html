<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Photo2Relief</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" href="data:," />
    <script type="importmap">
      { "imports": { "three": "/vendor/three/three.module.js" } }
    </script>
  </head>
  <body>
    <header>
      <div>
        <h1>Photo2Relief</h1>
        <p class="tagline">Photo &rarr; heightmap &rarr; CNC-machinable relief mesh (mm)</p>
      </div>
      <nav class="header-right">
        <a href="/help.html" target="_blank" class="help-link">Parameter guide</a>
        <span id="status-pill" class="pill pill-idle">No photo</span>
      </nav>
    </header>

    <main id="app">
      <aside class="sidebar">
        <section class="card" id="upload-card">
          <label id="dropzone" for="file-input">
            <span id="dropzone-text">Drop a photo here or click to choose</span>
            <input id="file-input" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" />
          </label>
          <p id="image-info" class="hint"></p>
        </section>

        <section class="card param-card" id="params-card" hidden>
          <div class="control model-control">
            <label class="name">Depth model</label>
            <select id="depth_model"></select>
            <p class="hint" id="model-hint"></p>
          </div>

          <div class="tabbar" role="tablist">
            <button class="tab active" data-tab="tab-size">Size</button>
            <button class="tab" data-tab="tab-shaping">Shaping</button>
            <button class="tab" data-tab="tab-export">Export</button>
          </div>

          <div class="tabpanel" id="tab-size">
            <div id="group-size"></div>
            <p class="hint" id="derived-size"></p>
          </div>

          <div class="tabpanel" id="tab-shaping" hidden>
            <div id="group-depth"></div>
            <div class="subhead">Surface</div>
            <div id="group-surface"></div>
          </div>

          <div class="tabpanel" id="tab-export" hidden>
            <div id="group-export"></div>
          </div>

          <button id="reset-btn" class="secondary">Reset to defaults</button>
        </section>

        <section class="card" id="export-card" hidden>
          <button id="export-btn">Export mesh</button>
          <p id="export-status" class="hint"></p>
          <p id="export-summary" class="summary" hidden></p>
        </section>
      </aside>

      <section class="previews">
        <div id="error-banner" class="error-banner" hidden></div>

        <div class="card preview-card">
          <div class="preview-head">
            <h2>Heightmap preview</h2>
            <label class="toggle"><input type="checkbox" id="grayscale-toggle" /> grayscale</label>
          </div>
          <div class="preview-body" id="preview2d-body">
            <p class="placeholder" id="preview2d-placeholder">Upload a photo to see the relief preview.</p>
            <img id="preview2d" alt="Hillshaded heightmap preview" hidden />
            <div class="busy-overlay" id="busy2d" hidden>
              <div class="spinner"></div>
              <span id="busy2d-text">Updating&hellip;</span>
            </div>
          </div>
        </div>

        <div class="card preview-card viewport-card">
          <div class="preview-head">
            <h2>3D preview <span class="hint">(reduced resolution &mdash; export is full-res)</span></h2>
          </div>
          <div class="preview-body" id="viewport">
            <p class="placeholder" id="preview3d-placeholder">The 3D preview appears here.</p>
            <div class="busy-overlay" id="busy3d" hidden>
              <div class="spinner"></div>
              <span id="busy3d-text">Updating&hellip;</span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
